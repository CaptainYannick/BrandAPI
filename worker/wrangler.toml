name = "brandapi"
main = "src/index.ts"
compatibility_date = "2026-08-02"

[vars]
# Pas dit aan zodra GitHub Pages voor dit repo aanstaat, bv:
# https://<jouw-github-gebruikersnaam>.github.io/BrandAPI
DATA_BASE_URL = "https://captainyannick.github.io/BrandAPI"

# Minimaal aantal keer dat een zelf-getypte winkelnaam voor moet komen voordat
# die op het /stats-dashboard verschijnt (privacy-drempel, zie README).
CUSTOM_THRESHOLD = 2

# Aanmaken: npx wrangler d1 create pasmaatje-stats
# Plak de database_id die dat commando teruggeeft hieronder.
[[d1_databases]]
binding = "STATS"
database_name = "pasmaatje-stats"
database_id = "e3d4e40f-766a-4b62-bd2e-6e9d74f685cc"

# Geen dashboard-actie nodig: dit is een code-only binding, direct actief na deploy.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
